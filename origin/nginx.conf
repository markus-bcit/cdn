# Custom log format to observe backhaul traffic and latency from Docker logs
log_format backhaul_log '[$time_local] $remote_addr '
                        '"$request" $status $body_bytes_sent '
                        'request_time=$request_time '
                        'upstream_bytes=$bytes_sent '
                        'agent="$http_user_agent"';

server {
    listen 80;
    server_name origin localhost;

# Where HLS media directories are mounted inside the container
    root /usr/share/nginx/html;

# Dedicated access log to track backhaul bandwidth consumption
    access_log /var/log/nginx/access.log backhaul_log;
    error_log  /var/log/nginx/error.log warn;

# -------------------------------------------------------------
# Performance & Streaming Optimizations
# -------------------------------------------------------------
# Zero-copy data transfer: streams video chunks directly from SSD 
# to the network socket without copying into user-space memory.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

# -------------------------------------------------------------
# Simulated Satellite / Cellular Backhaul (Optional)
#------------------------------------------------------------
# In transit (NetSkrt), backhaul bandwidth is limited.
# Uncomment limit_rate to cap origin download speed (e.g., 2 MB/s per connection)
    limit_rate 2m;

#------------------------------------------------------------
# Global CORS (Cross-Origin Resource Sharing)
# -------------------------------------------------------------
# Allows the FastAPI proxy and any browser-based test players (e.g., hls.js)
# to fetch playlists and segments without CORS errors.
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

# -------------------------------------------------------------
    # HLS Media Serving Route
# -------------------------------------------------------------
    location /media/ {
        # Handle HTTP OPTIONS preflight checks from browsers
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # 1. HLS Master and Variant Playlists (.m3u8)
        # Plain-text files describing available streams and chunk lists
        location ~* \.m3u8$ {
            types {
                application/vnd.apple.mpegurl m3u8;
            }
            # Playlists can be cached briefly for VOD (e.g., 5 minutes)
            add_header Cache-Control "public, max-age=300";
            add_header Access-Control-Allow-Origin * always;
        }

        # 2. HLS Video Chunks (.ts)
        # Binary MPEG-TS segments (the heavy payloads)
        location ~* \.ts$ {
            types {
                video/mp2t ts;
            }
            # Segments never change once written. Mark them immutable
            # so the edge knows it never needs to revalidate them.
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin * always;
        }

        try_files $uri =404;
    }

# -------------------------------------------------------------
    # Health Check Endpoint
    # -------------------------------------------------------------
    # Used by docker-compose healthcheck to confirm origin is ready
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "origin healthy\n";
    }
}
