networks:
  # 1. Backhaul link between Edge and Origin (simulates satellite/cellular)
  backhaul_net:
    driver: bridge

  # 2. Local network between Clients and Edge (simulates on-train Wi-Fi)
  edge_net:
    driver: bridge

services:
  origin:
    image: nginx:alpine
    container_name: cdn-origin
    restart: unless-stopped
    volumes:
      # Mount the config file to override default Nginx server block
      - ./origin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount the media folder containing your HLS chunks
      - ./origin/media:/usr/share/nginx/html/media:ro
    ports:
      - "8080:80"   # Inspect directly at http://localhost:8080/media/...
    networks:
      - backhaul_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: cdn-toxiproxy
    networks:
      - backhaul_net
    ports:
      - "8474:8474"   # API port to configure latency on the fly

  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: cdn-edge
    restart: unless-stopped
    environment:
      - ORIGIN_URL=http://origin:80/media
      - CACHE_DIR=/app/cache
      - CACHE_MAX_BYTES=209715200   # 200 MB disk cap
      - EVICTION_POLICY=lru         # "lru" or "video_aware"
      - SQLITE_DB_PATH=/app/data/edge.db
    volumes:
      - ./edge:/app
      - ./edge/cache_data:/app/cache
      - ./edge/data:/app/data
    ports:
      - "8000:8000"
    networks:
      - backhaul_net   # To reach origin for cache misses
      - edge_net       # To serve clients/viewers
    depends_on:
      origin:
        condition: service_healthy
